<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
  <title id="title">Forma's design-to-code workflow</title>
  <desc id="desc">Four steps connect Figma decisions to generated tokens, React or Angular components, and Storybook verification.</desc>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1f3425" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1600" height="690" fill="#f4f7f2"/>
  <text x="100" y="92" fill="#65816d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" letter-spacing="3">DESIGN → TOKENS → CODE</text>
  <text x="100" y="151" fill="#1d2b21" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.4">One decision. Four connected steps.</text>
  <g filter="url(#soft-shadow)">
    <rect x="90" y="208" width="326" height="268" rx="18" fill="#fff" stroke="#d9e2da"/>
    <rect x="444" y="208" width="326" height="268" rx="18" fill="#fff" stroke="#d9e2da"/>
    <rect x="798" y="208" width="326" height="268" rx="18" fill="#fff" stroke="#d9e2da"/>
    <rect x="1152" y="208" width="326" height="268" rx="18" fill="#fff" stroke="#d9e2da"/>
  </g>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="120" y="251" fill="#7b8b7e" font-size="12" letter-spacing="2">01 / DEFINE</text>
    <text x="120" y="313" fill="#27563d" font-size="34" font-weight="700">Figma</text>
    <text x="120" y="356" fill="#26342a" font-size="18" font-weight="650">Name the decision</text>
    <text x="120" y="390" fill="#67746a" font-size="14">Variables · text styles · component sets</text>
    <rect x="120" y="423" width="204" height="28" rx="7" fill="#edf5ef"/>
    <text x="136" y="442" fill="#416b4d" font-size="12">Native library source</text>

    <text x="474" y="251" fill="#7b8b7e" font-size="12" letter-spacing="2">02 / BUILD</text>
    <text x="474" y="313" fill="#27563d" font-size="34" font-weight="700">Tokens</text>
    <text x="474" y="356" fill="#26342a" font-size="18" font-weight="650">Validate and generate</text>
    <text x="474" y="390" fill="#67746a" font-size="14">One token JSON source</text>
    <rect x="474" y="423" width="247" height="28" rx="7" fill="#edf5ef"/>
    <text x="490" y="442" fill="#416b4d" font-size="12">CSS · Tokens Studio JSON · package</text>

    <text x="828" y="251" fill="#7b8b7e" font-size="12" letter-spacing="2">03 / COMPOSE</text>
    <text x="828" y="313" fill="#27563d" font-size="34" font-weight="700">Code</text>
    <text x="828" y="356" fill="#26342a" font-size="18" font-weight="650">Keep frameworks aligned</text>
    <text x="828" y="390" fill="#67746a" font-size="14">React + Angular share the decisions</text>
    <rect x="828" y="423" width="212" height="28" rx="7" fill="#edf5ef"/>
    <text x="844" y="442" fill="#416b4d" font-size="12">Components · themes · aliases</text>

    <text x="1182" y="251" fill="#7b8b7e" font-size="12" letter-spacing="2">04 / VERIFY</text>
    <text x="1182" y="313" fill="#27563d" font-size="34" font-weight="700">Storybook</text>
    <text x="1182" y="356" fill="#26342a" font-size="18" font-weight="650">Inspect before shipping</text>
    <text x="1182" y="390" fill="#67746a" font-size="14">Variants · interactions · accessibility</text>
    <rect x="1182" y="423" width="204" height="28" rx="7" fill="#edf5ef"/>
    <text x="1198" y="442" fill="#416b4d" font-size="12">Real React and Angular stories</text>
  </g>
  <g fill="none" stroke="#91b69a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M416 342h25m-8-8 8 8-8 8"/>
    <path d="M770 342h25m-8-8 8 8-8 8"/>
    <path d="M1124 342h25m-8-8 8 8-8 8"/>
  </g>
  <rect x="90" y="526" width="1388" height="88" rx="14" fill="#27563d"/>
  <circle cx="132" cy="570" r="9" fill="#c8e867"/>
  <text x="160" y="566" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="650">Light and Dark modes · local-first review · no service sync</text>
  <text x="160" y="592" fill="#cfe0d2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Illustrative workflow map based on the supplied Forma screens; not a captured product screenshot.</text>
</svg>
