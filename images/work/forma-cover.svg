<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Forma — one source, a shared language</title>
  <desc id="desc">An editorial illustration of Forma's forest-green design system identity and local Figma plugin, with 170 typed tokens, React and Angular outputs, and work-in-progress status.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfa"/>
      <stop offset="1" stop-color="#edf3ee"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#102a1c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="980" fill="url(#paper)"/>
  <rect width="680" height="980" fill="#27563d"/>
  <g transform="translate(84 112)">
    <rect width="22" height="22" fill="#f5fbf6"/>
    <rect x="30" width="22" height="22" fill="#edf5ef"/>
    <rect y="30" width="22" height="22" fill="#edf5ef"/>
    <rect x="30" y="30" width="22" height="22" fill="#c8e867"/>
  </g>
  <text x="82" y="338" fill="#f8fbf8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="122" font-weight="650" letter-spacing="-7">forma<tspan fill="#c8e867">.</tspan></text>
  <text x="86" y="418" fill="#f1f7f2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="33" font-weight="480">One source.</text>
  <text x="86" y="461" fill="#f1f7f2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="33" font-weight="480">A shared language.</text>
  <rect x="86" y="510" width="104" height="6" rx="3" fill="#c8e867"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">
    <circle cx="95" cy="582" r="5" fill="#c8e867"/>
    <text x="114" y="589" fill="#f8fbf8"><tspan font-weight="700">170 typed tokens</tspan><tspan fill="#c5d9cb"> → native variables, styles and components</tspan></text>
    <circle cx="95" cy="650" r="5" fill="#c8e867"/>
    <text x="114" y="657" fill="#f8fbf8">One token source for <tspan font-weight="700">React and Angular</tspan></text>
    <circle cx="95" cy="718" r="5" fill="#c8e867"/>
    <text x="114" y="725" fill="#f8fbf8">A local-first Figma plugin; <tspan font-weight="700">no service sync</tspan></text>
  </g>
  <text x="86" y="892" fill="#b7d0bf" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" letter-spacing="3.4">DESIGNED &amp; CREATED BY LULAMILE MKHUNGELA</text>

  <text x="1044" y="87" fill="#63746a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" letter-spacing="4">THE FORMA PLUGIN · WORK IN PROGRESS</text>
  <g filter="url(#shadow)">
    <rect x="830" y="122" width="668" height="740" rx="26" fill="#fff"/>
    <g transform="translate(880 170)">
      <rect width="46" height="46" rx="13" fill="#27563d"/>
      <rect x="11" y="10" width="10" height="10" fill="#f1f7f2"/>
      <rect x="25" y="10" width="10" height="10" fill="#e5f0e7"/>
      <rect x="11" y="24" width="10" height="10" fill="#e5f0e7"/>
      <rect x="25" y="24" width="10" height="10" fill="#c8e867"/>
      <text x="59" y="29" fill="#1e2d23" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="27" font-weight="700">forma.</text>
      <text x="61" y="44" fill="#7b867d" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="8" letter-spacing="1.4">A LIVING DESIGN SYSTEM</text>
    </g>
    <line x1="880" y1="245" x2="1448" y2="245" stroke="#e2e9e3"/>
    <text x="880" y="300" fill="#17251b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="720">One source.</text>
    <text x="880" y="340" fill="#17251b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="720">A shared language.</text>
    <text x="880" y="386" fill="#69736b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Build native variables, text styles and component sets</text>
    <text x="880" y="410" fill="#69736b" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">from the tokens used by React and Angular.</text>
    <rect x="880" y="445" width="568" height="48" rx="9" fill="#f0f6f1" stroke="#dbe9df"/>
    <text x="900" y="475" fill="#476c54" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">170 typed tokens · shared across two frameworks</text>
    <rect x="880" y="522" width="273" height="48" rx="10" fill="#fbfcfa" stroke="#cbd5cc"/>
    <rect x="1165" y="522" width="283" height="48" rx="10" fill="#fbfcfa" stroke="#cbd5cc"/>
    <text x="920" y="552" fill="#33443a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Import token JSON</text>
    <text x="1198" y="552" fill="#33443a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Use bundled tokens</text>
    <rect x="880" y="596" width="568" height="56" rx="10" fill="#27563d"/>
    <text x="1030" y="631" fill="#fff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="650">Build design library →</text>
    <rect x="880" y="670" width="568" height="42" rx="10" fill="#fff" stroke="#d9e0da"/>
    <text x="1032" y="697" fill="#35443a" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14">Export edited Figma variables ↓</text>
    <rect x="880" y="736" width="568" height="72" rx="10" fill="#fff9e8" stroke="#efd990"/>
    <text x="900" y="765" fill="#8c6820" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">Your design file stays local. Nothing is sent to a service.</text>
    <text x="900" y="788" fill="#8c6820" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">The native design-library share link is still to be reviewed.</text>
  </g>
</svg>
