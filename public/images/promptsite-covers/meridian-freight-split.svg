<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Meridian split-layout freight hero</title><desc id="desc">White navigation over a navy split hero with shipment search, sample metrics and a Durban cargo ship scene.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#415365"/><stop offset=".5" stop-color="#e3a16e"/><stop offset="1" stop-color="#24536a"/></linearGradient>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#14283a"/><stop offset="1" stop-color="#08141f"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1200" height="900" fill="#08141f"/>
<rect x="0" y="0" width="1200" height="112" fill="#fff"/>
<circle cx="82" cy="56" r="20" fill="none" stroke="#ff6b1f" stroke-width="4"/><path d="M82 38v36" stroke="#ff6b1f" stroke-width="3"/><text x="117" y="63" fill="#08141f" font-family="Arial,sans-serif" font-size="23" font-weight="700">Meridian</text>
<text x="317" y="62" fill="#303a45" font-family="Arial,sans-serif" font-size="13">Home     Services     Tracking     Industries     Company</text><path d="M317 78h39" stroke="#ff6b1f" stroke-width="3"/>
<text x="949" y="63" fill="#59616a" font-family="Arial,sans-serif" font-size="13">Sign in</text><rect x="1004" y="34" width="152" height="48" rx="24" fill="#ff6b1f"/><text x="1080" y="63" fill="#08141f" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET A QUOTE →</text>
<rect x="0" y="112" width="1200" height="788" fill="url(#night)"/>
<circle cx="940" cy="340" r="244" fill="#e58c54" opacity=".16"/><path d="M670 542 773 430l81 73 111-179 100 98 135-54v314H670Z" fill="#315162" opacity=".7"/><path d="M670 644c159-55 284-42 530-9v265H670Z" fill="#164f60"/>
<!-- left content -->
<circle cx="92" cy="223" r="5" fill="#2ee59d"/><text x="109" y="228" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3">LIVE FREIGHT TRACKING</text>
<text x="87" y="304" fill="#fff" font-family="Arial,sans-serif" font-size="45" font-weight="800" letter-spacing="-2">Every container.</text><text x="87" y="359" fill="#ff6b1f" font-family="Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-2">Every mile.</text><text x="87" y="414" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="800" letter-spacing="-2">Accounted for.</text>
<text x="90" y="458" fill="#dce4eb" font-family="Arial,sans-serif" font-size="14">Sea, air and road freight with live visibility.</text><text x="90" y="481" fill="#dce4eb" font-family="Arial,sans-serif" font-size="14">From Durban harbour to a Johannesburg warehouse.</text>
<rect x="87" y="511" width="505" height="61" rx="14" fill="#fff" filter="url(#shadow)"/><circle cx="119" cy="541" r="9" fill="none" stroke="#84909a" stroke-width="2"/><path d="m126 548 7 7" stroke="#84909a" stroke-width="2"/><text x="151" y="546" fill="#87919a" font-family="Arial,sans-serif" font-size="13">Enter container or B/L number</text><rect x="496" y="519" width="83" height="45" rx="11" fill="#ff6b1f"/><text x="537" y="547" fill="#08141f" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">TRACK →</text>
<path d="M213 601v57M341 601v57M465 601v57" stroke="#fff" stroke-opacity=".25"/>
<g fill="#fff" font-family="Arial,sans-serif"><text x="89" y="621" font-size="20" font-weight="700">98.7%</text><text x="89" y="641" font-size="10" fill="#c4d1dd">On-time arrival</text><text x="230" y="621" font-size="20" font-weight="700">340+</text><text x="230" y="641" font-size="10" fill="#c4d1dd">Ports worldwide</text><text x="359" y="621" font-size="20" font-weight="700">180+</text><text x="359" y="641" font-size="10" fill="#c4d1dd">Routes served</text><text x="485" y="621" font-size="20" font-weight="700">24/7</text><text x="485" y="641" font-size="10" fill="#c4d1dd">Live support</text></g>
<!-- right image card -->
<g filter="url(#shadow)"><rect x="660" y="180" width="459" height="594" rx="28" fill="url(#sky)" stroke="#fff" stroke-opacity=".34" stroke-width="2"/></g>
<circle cx="1015" cy="300" r="61" fill="#ffd18b" opacity=".7"/><path d="M662 433 755 364l89 53 93-112 79 107 73-58 28 34v199H662Z" fill="#354e55"/><path d="M661 540 1118 540v234H661Z" fill="#13556a"/>
