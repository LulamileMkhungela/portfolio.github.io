<!-- ship hull and containers -->
<path d="M729 618h306l-42 82H784Z" fill="#172b35" stroke="#d2dee3" stroke-width="3"/><rect x="773" y="565" width="52" height="56" fill="#cc543e"/><rect x="830" y="558" width="52" height="63" fill="#ef9a45"/><rect x="887" y="569" width="52" height="52" fill="#275b70"/><rect x="944" y="552" width="55" height="69" fill="#d25e3b"/><path d="M757 699h260" stroke="#f0c489" stroke-width="5"/>
<!-- jet -->
<g transform="translate(885 395) scale(.6)" fill="#f6f7f8" stroke="#d3dde2" stroke-width="4"><path d="M-9-79 0-115 9-79 20-43 108-17 109-2 23-20 19 31 56 48 55 59 12 49 0 79-12 49-55 59-56 48-19 31-23-20-109-2-108-17-20-43Z"/></g>
<rect x="684" y="720" width="230" height="38" rx="19" fill="#08141f" fill-opacity=".78" stroke="#fff" stroke-opacity=".2"/><text x="799" y="744" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PORT OF DURBAN · SOUTH AFRICA</text>
<text x="600" y="843" fill="#cbd6df" fill-opacity=".7" font-family="Arial,sans-serif" font-size="10" text-anchor="middle" letter-spacing="2">SAMPLE METRICS FOR A FICTIONAL BRAND · SOUTH AFRICA + SADC</text>
</svg>