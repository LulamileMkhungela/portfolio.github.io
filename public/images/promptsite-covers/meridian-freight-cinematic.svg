<text x="431" y="104" fill="#fff" font-family="Arial,sans-serif" font-size="13">Home     Services     Tracking     Industries     Company</text><path d="M430 119h39" stroke="#ff6b1f" stroke-width="3"/><rect x="961" y="80" width="151" height="48" rx="24" fill="#ff6b1f"/><text x="1036" y="109" fill="#08141f" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle">GET A QUOTE →</text>
<circle cx="600" cy="215" r="5" fill="#2ee59d"/><text x="616" y="220" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">LIVE FREIGHT TRACKING</text>
<text x="600" y="298" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="-2">Every container. <tspan fill="#ff6b1f">Every mile.</tspan></text><text x="600" y="359" fill="#fff" font-family="Arial,sans-serif" font-size="53" font-weight="800" text-anchor="middle" letter-spacing="-2">Accounted for.</text>
<text x="600" y="401" fill="#f3f6f8" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Sea, air and road freight with live visibility from Durban harbour to your doorstep.</text>
