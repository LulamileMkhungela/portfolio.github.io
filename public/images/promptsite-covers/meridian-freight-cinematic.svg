<text x="126" y="724" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">98.7%</text><text x="259" y="724" fill="#d6e0e8" font-family="Arial,sans-serif" font-size="13">On-time arrival</text><path d="M254 698v54" stroke="#ffffff" stroke-opacity=".25"/><text x="126" y="762" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">340+</text><text x="205" y="762" fill="#d6e0e8" font-family="Arial,sans-serif" font-size="13">Ports worldwide</text>
