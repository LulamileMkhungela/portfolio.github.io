<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Meridian cinematic freight hero</title><desc id="desc">A sunset freight-tracking hero with a passenger jet above Durban harbour and two sample-metric panels.</desc>
<defs>
