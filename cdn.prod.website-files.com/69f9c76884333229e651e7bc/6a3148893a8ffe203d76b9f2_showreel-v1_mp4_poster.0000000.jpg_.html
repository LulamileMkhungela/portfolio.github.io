<script>
  //navbar text
  gsap.set('.navbar_logo-anim', { autoAlpha: 1 });

  let blocks = gsap.utils.toArray('.navbar_logo-anim_text');
  let step = 2.8; // time between blocks -> lower = more overlap (must be >= enter+hold = 2.5)
  let period = step * blocks.length; // shared loop length

  blocks.forEach((el, i) => {
    let chars = SplitText.create(el, { type: 'chars' }).chars;
    gsap.set(chars, { yPercent: 100, opacity: 0 });
    let iter = 0.8 + 2 + 0.04 * (chars.length - 1); // enter(0.4) + hold(2) + exit(0.4) + stagger on both
    gsap
      .timeline({ repeat: -1, delay: i * step, repeatDelay: period - iter })
      .to(chars, { yPercent: 0, opacity: 1, stagger: 0.02, duration: 0.5 })
      .to(chars, { yPercent: -100, opacity: 0, stagger: 0.02, duration: 0.5 }, '+=2');
  });


    ////timer


  const cities = {
  london: 'Europe/London',
  newyork: 'America/New_York',
  kyiv: 'Europe/Kyiv'
};

function updateClocks() {
  const now = new Date();

  for (const [city, timeZone] of Object.entries(cities)) {
    const card = document.querySelector(`[data-time="${city}"]`);
    if (!card) continue;

    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone,
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    }).formatToParts(now);

    const hour = parts.find(p => p.type === 'hour').value;
    const minute = parts.find(p => p.type === 'minute').value;
    const period = parts.find(p => p.type === 'dayPeriod').value;

    card.querySelector('.time').textContent = `${hour}:${minute}`;
    card.querySelector('.time-pm').textContent = period.toLowerCase();

    card.querySelector('.date').textContent = new Intl.DateTimeFormat('en-US', {
      timeZone,
      weekday: 'long',
      month: 'long',
      day: 'numeric'
    }).format(now);
  }
}

updateClocks();
setInterval(updateClocks, 1000);



///keen
(function () {
  const els = document.querySelectorAll(
    ".blog_list-v3.keen-slider, [data-slider='mobile-slider']"
  )
  if (!els.length) return

  const mq = window.matchMedia("(max-width: 991px)")

  const instances = Array.from(els).map(function (el) {
    let slider = null

    return {
      init: function () {
        if (slider) return
        slider = new KeenSlider(el, {
          loop: false,
          slides: { perView: 1, spacing: 16 },
        })
      },
      destroy: function () {
        if (!slider) return
        slider.destroy()
        slider = null
      },
    }
  })

  function sync() {
    instances.forEach(function (s) {
      mq.matches ? s.init() : s.destroy()
    })
  }

  sync()
  mq.addEventListener("change", sync)
})();

(function(){
  const cv = document.getElementById("space");
  if(!cv || typeof cv.getContext !== "function") return;   // not present, or not a <canvas>
  const x = cv.getContext("2d");
  if(!x) return;                                           // context unavailable

  const rmq = matchMedia("(prefers-reduced-motion:reduce)");
  let rm = rmq.matches;

  // ⬇⬇⬇  CHANGE THIS to control how fast you fly forward  ⬇⬇⬇
  const SPEED = 0.00005;   // slower = lower number  (try 0.00005 very slow → 0.0006 fast)
  // ⬆⬆⬆ -------------------------------------------------- ⬆⬆⬆
  const r = (a,b)=>a+Math.random()*(b-a);

  let W,H,cx,cy,D,F,N,stars,raf,last;

  function reset(s){ s.x=r(-1,1); s.y=r(-1,1); s.z=1; s.fresh=true; }
  function project(s){ const k=F/s.z; s.px=cx+s.x*k; s.py=cy+s.y*k; }

  function build(){
    D=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
    cx=W/2; cy=H/2; F=cx*0.7;
    cv.width=W*D; cv.height=H*D; x.setTransform(D,0,0,D,0,0);
    N=Math.min(Math.round(W*H*0.0004),700);
    stars=[];
    for(let i=0;i<N;i++){ const s={}; reset(s); s.z=r(0.05,1); project(s); stars.push(s); }
  }

  function frame(t){
    const dt=Math.min(t-last,50); last=t;
    x.clearRect(0,0,W,H);
    x.fillStyle="#fff"; x.strokeStyle="#fff";
    for(let i=0;i<N;i++){
      const s=stars[i];
      s.z-=dt*SPEED;
      if(s.z<0.02){ reset(s); project(s); continue; }
      const ox=s.px, oy=s.py; project(s);
      if(s.px<-50||s.px>W+50||s.py<-50||s.py>H+50){ reset(s); project(s); continue; }
      const d=1-s.z;                       // 0 far → 1 near
      const a=Math.min(d*1.1,1);
      const w=0.4+d*1.8;                    // size grows as it nears
      x.globalAlpha=a;
      if(s.fresh){ s.fresh=false; }         // skip streak on the first frame
      else if(d>0.55){                      // streaks only for close, fast stars
        x.lineWidth=w; x.beginPath(); x.moveTo(ox,oy); x.lineTo(s.px,s.py); x.stroke();
      }
      x.beginPath(); x.arc(s.px,s.py,w*0.6,0,6.2832); x.fill();
    }
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(!raf&&!rm){ last=performance.now(); raf=requestAnimationFrame(frame); } }
  function stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
  function still(){ x.clearRect(0,0,W,H); x.fillStyle="#fff"; x.globalAlpha=1;
    for(const s of stars){ x.globalAlpha=Math.min((1-s.z)*1.1,1);
      x.beginPath(); x.arc(s.px,s.py,(0.4+(1-s.z)*1.8)*0.6,0,6.2832); x.fill(); } }

  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());

  let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{build();if(rm)still();},150);});

  const onMotion=e=>{ rm=e.matches; if(rm){ stop(); still(); } else start(); };
  rmq.addEventListener ? rmq.addEventListener("change",onMotion) : rmq.addListener(onMotion);

  build(); rm?still():start();
})();
