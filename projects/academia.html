<style id="lula-protect">
*{
  -webkit-user-select:none !important;
  -moz-user-select:none !important;
  -ms-user-select:none !important;
  user-select:none !important;
}
img{pointer-events:none !important}
</style>
<script id="lula-protect-js">
(function(){
  // Block right-click
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
  // Block Ctrl+C, Ctrl+A, Ctrl+S, Ctrl+U (view source), Ctrl+P (print)
  document.addEventListener('keydown', function(e){
    var ctrl = e.ctrlKey || e.metaKey;
    if(ctrl && ['c','a','s','u','p','x'].indexOf(e.key.toLowerCase()) > -1){
      e.preventDefault(); return false;
    }
    // Block F12 / DevTools
    if(e.key === 'F12'){ e.preventDefault(); return false; }
    // Block Ctrl+Shift+I/J/C (DevTools)
    if(ctrl && e.shiftKey && ['i','j','c'].indexOf(e.key.toLowerCase()) > -1){
      e.preventDefault(); return false;
    }
  });
  // Block drag of images
  document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
  // Block text selection on double-click
  document.addEventListener('selectstart', function(e){ e.preventDefault(); return false; });
  // Block copy event
  document.addEventListener('copy', function(e){ e.preventDefault(); return false; });
  // Block cut event  
  document.addEventListener('cut', function(e){ e.preventDefault(); return false; });
})();
</script>
<style id="lula-navbar-v2">
.lula-persona-pill{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);cursor:pointer;position:relative;user-select:none;font-size:13px;font-weight:500;color:#fff;white-space:nowrap;transition:background .2s;}
.lula-persona-pill:hover{background:rgba(255,255,255,.14);}
.lula-persona-pill .pill-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;flex-shrink:0;}

.lula-persona-option.active{background:rgba(255,255,255,.06);}
.lula-persona-option .opt-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.lula-nav-links{display:flex;align-items:center;gap:2px;}
.lula-nav-link{position:relative;display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:500;color:rgba(255,255,255,.75);text-decoration:none;cursor:pointer;white-space:nowrap;transition:color .2s,background .2s;background:transparent;border:none;}
.lula-nav-link:hover,.lula-nav-link.open{color:#fff;background:rgba(255,255,255,.08);}
.lula-nav-link .ln-dot{width:5px;height:5px;border-radius:50%;background:#a78bfa;flex-shrink:0;}
.lula-nav-link .ln-chevron{width:14px;height:14px;opacity:.55;transition:transform .2s;}
.lula-nav-link.open .ln-chevron{transform:rotate(180deg);}
.lula-mega{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(-50%);background:#18191c;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:24px;z-index:9999;display:none;box-shadow:0 20px 60px rgba(0,0,0,.55);min-width:480px;}
.lula-mega.open{display:block;}
.lula-mega-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:16px;}
.lula-mega-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;}
.lula-mega-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:10px;text-decoration:none;transition:background .15s;}
.lula-mega-item:hover{background:rgba(255,255,255,.06);}
.lula-mega-icon{font-size:20px;line-height:1;margin-top:1px;flex-shrink:0;}
.lula-mega-item-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px;}
.lula-mega-item-desc{font-size:12px;color:rgba(255,255,255,.45);line-height:1.4;}
@media(max-width:991px){.lula-nav-links,.lula-persona-wrap{display:none!important;}}

<!-- Back to top button -->
<style>
  #btt-btn {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fff;
    color: #0F1011;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease, box-shadow .25s ease;
    z-index: 9999;
    pointer-events: none;
  }
  #btt-btn.btt-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  #btt-btn:hover {
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transform: translateY(-2px);
  }
  #btt-btn svg { display:block; }
  @media (max-width: 767px) {
    #btt-btn { bottom: 20px; right: 20px; width: 44px; height: 44px; }
  }
</style>
<button id="btt-btn" aria-label="Back to top">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
    <path d="M10 15V5M10 5L5.5 9.5M10 5L14.5 9.5" stroke="#0F1011" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<script>
(function(){
  var btn = document.getElementById('btt-btn');
  if (!btn) return;
  window.addEventListener('scroll', function(){
    if (window.scrollY > 400) {
      btn.classList.add('btt-visible');
    } else {
      btn.classList.remove('btt-visible');
    }
  }, { passive: true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>

<script id="lula-nav-js">(function(){var p=localStorage.getItem('lula-persona')||'me';function apply(persona){p=persona;localStorage.setItem('lula-persona',persona);var pl=document.getElementById('lula-pill-label'),wl=document.getElementById('lula-whatwedo-label'),ml=document.getElementById('lula-whatwedo-mega-label'),al=document.getElementById('lula-about-link'),cm=document.getElementById('lula-check-me'),pill=document.getElementById('lula-pill');if(persona==='me'){if(pl)pl.textContent='For Me';if(wl)wl.textContent='What I do';if(ml)ml.textContent='What I do';if(al)al.textContent='About Me';if(cm)cm.style.display='';if(pill)pill.querySelector('.pill-dot').style.background='#a78bfa';document.querySelectorAll('.lula-persona-option').forEach(function(o,i){o.classList.toggle('active',i===0);});}else{if(pl)pl.textContent='For Business';if(wl)wl.textContent='What we do';if(ml)ml.textContent='What we do';if(al)al.textContent='About us';if(cm)cm.style.display='none';if(pill)pill.querySelector('.pill-dot').style.background='#38bdf8';document.querySelectorAll('.lula-persona-option').forEach(function(o,i){o.classList.toggle('active',i===1);});}}window.lulaTogglePill=function(){var pill=document.getElementById('lula-pill'),menu=document.getElementById('lula-persona-menu');if(pill)pill.classList.toggle('open');if(menu)menu.classList.toggle('open');};window.lulaSetPersona=function(persona,e){if(e)e.stopPropagation();apply(persona);var pill=document.getElementById('lula-pill'),menu=document.getElementById('lula-persona-menu');if(pill)pill.classList.remove('open');if(menu)menu.classList.remove('open');};window.lulaToggleMega=function(id,trigger){var mega=document.getElementById(id);if(!mega)return;var wasOpen=mega.classList.contains('open');document.querySelectorAll('.lula-mega').forEach(function(m){m.classList.remove('open');});document.querySelectorAll('.lula-nav-link').forEach(function(l){l.classList.remove('open');});if(!wasOpen){mega.classList.add('open');if(trigger)trigger.classList.add('open');}};document.addEventListener('click',function(e){if(!e.target.closest('.lula-persona-wrap')){var pill=document.getElementById('lula-pill'),menu=document.getElementById('lula-persona-menu');if(pill)pill.classList.remove('open');if(menu)menu.classList.remove('open');}if(!e.target.closest('.lula-nav-link')){document.querySelectorAll('.lula-mega').forEach(function(m){m.classList.remove('open');});document.querySelectorAll('.lula-nav-link').forEach(function(l){l.classList.remove('open');});}});document.addEventListener('DOMContentLoaded',function(){apply(p);});})();</script>
