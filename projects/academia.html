<style id="lula-protect">
*{
  -webkit-user-select:none !important;
  -moz-user-select:none !important;
  -ms-user-select:none !important;
  user-select:none !important;
}
img{pointer-events:none !important}
</style>
<script id="lula-protect-js">
(function(){
  // Block right-click
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
  // Block Ctrl+C, Ctrl+A, Ctrl+S, Ctrl+U (view source), Ctrl+P (print)
  document.addEventListener('keydown', function(e){
    var ctrl = e.ctrlKey || e.metaKey;
    if(ctrl && ['c','a','s','u','p','x'].indexOf(e.key.toLowerCase()) > -1){
      e.preventDefault(); return false;
    }
    // Block F12 / DevTools
    if(e.key === 'F12'){ e.preventDefault(); return false; }
    // Block Ctrl+Shift+I/J/C (DevTools)
    if(ctrl && e.shiftKey && ['i','j','c'].indexOf(e.key.toLowerCase()) > -1){
      e.preventDefault(); return false;
    }
  });
  // Block drag of images
  document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
  // Block text selection on double-click
  document.addEventListener('selectstart', function(e){ e.preventDefault(); return false; });
  // Block copy event
  document.addEventListener('copy', function(e){ e.preventDefault(); return false; });
  // Block cut event  
  document.addEventListener('cut', function(e){ e.preventDefault(); return false; });
})();
</script>
</head>
<body></body>
</html>
